    <!-- Global Nabız navbar beacon — tek source of truth -->
    <script>
    (function () {
        // 4-katmanlı sağlık paleti (Hero ile birebir tutarlı)
        function colorOf(s) {
            if (s >= 90) return '#16a34a'; // yeşil — mükemmel
            if (s >= 75) return '#2563eb'; // mavi  — stabil
            if (s >= 50) return '#d97706'; // amber — izlenmeli
            return '#dc2626';              // kırmızı — kritik
        }
        function microOf(s, hasData) {
            if (!hasData) return 'Veri Bekleniyor';
            if (s >= 90) return 'Mükemmel';
            if (s >= 75) return 'Stabil';
            if (s >= 50) return 'İzlenmeli';
            return 'Kritik';
        }
        window.HealthIndicator = {
            _last: null,
            set: function (score, hasData) {
                var s = Number(score) || 0;
                var has = (hasData !== false) && (s > 0 || hasData === true);
                this._last = { score: s, hasData: has };

                var v = document.querySelector('#navbarHealthBeacon .health-value');
                var f = document.querySelector('#navbarHealthBeacon .health-fill');
                var d = document.querySelector('#navbarHealthBeacon .health-pulse-dot');
                var l = document.querySelector('#navbarHealthBeacon .health-label');

                var color = colorOf(s);
                var micro = microOf(s, has);

                if (v) v.textContent = has ? s : '—';
                if (f) {
                    f.setAttribute('stroke-dasharray', (has ? s : 0) + ', 100');
                    f.setAttribute('stroke', color);
                }
                if (d) {
                    d.style.background = color;
                    d.style.color = color; // currentColor for box-shadow
                    d.classList.toggle('critical', has && s < 50);
                }
                if (l) l.textContent = micro;
            },
            // Tab değişiminde son skor varsa tekrar uygula (loading state'i önler)
            reapply: function () {
                if (this._last) this.set(this._last.score, this._last.hasData);
            }
        };
    })();
    </script>

	<div id="purchaseModal" style="
		display:none;
		position:fixed;
		inset:0;
		background:rgba(15, 23, 42, 0.5);
		backdrop-filter:blur(4px);
		-webkit-backdrop-filter:blur(4px);
		z-index:9999;
		align-items:center;
		justify-content:center;
		padding:20px;
	">
		<div style="
			background:#ffffff;
			width:100%;
			max-width:600px;
			border-radius:20px;
			box-shadow:0 25px 60px rgba(15, 23, 42, 0.25), 0 8px 24px rgba(15, 23, 42, 0.12);
			border:1px solid #e2e8f0;
			overflow:hidden;
			animation:purchaseModalIn 0.25s ease-out;
		">
			<style>
				@keyframes purchaseModalIn {
					from { opacity:0; transform:scale(0.95) translateY(10px); }
					to   { opacity:1; transform:scale(1) translateY(0); }
				}
				.pm-label {
					display:block;
					font-size:13px;
					font-weight:700;
					color:#334155;
					margin-bottom:6px;
					letter-spacing:0.01em;
				}
				.pm-input, .pm-select {
					width:100%;
					padding:12px 14px;
					font-size:15px;
					border:1.5px solid #e2e8f0;
					border-radius:12px;
					background:#f8fafc;
					color:#0f172a;
					transition:border-color 0.15s, box-shadow 0.15s;
					outline:none;
					box-sizing:border-box;
				}
				.pm-input:focus, .pm-select:focus {
					border-color:#6366f1;
					box-shadow:0 0 0 3px rgba(99, 102, 241, 0.12);
					background:#fff;
				}
				.pm-input::placeholder { color:#94a3b8; }
			</style>

			<!-- HEADER -->
			<div style="padding:24px 28px 16px 28px; border-bottom:1px solid #f1f5f9;">
				<h3 style="margin:0; font-size:22px; font-weight:800; color:#0f172a; letter-spacing:-0.02em;">
					Alis Gir
				</h3>
				<p style="margin:6px 0 0 0; font-size:14px; color:#64748b; line-height:1.4;">
					Urune yeni alis kaydi gir
				</p>
			</div>

			<!-- FORM BODY -->
			<div style="padding:20px 28px 8px 28px;">

				<!-- ROW 1: Urun + KDV -->
				<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
					<div>
						<label class="pm-label">Urun</label>
						<select id="purchaseProduct" class="pm-select"></select>
					</div>
					<div>
						<label class="pm-label">KDV Orani</label>
						<select id="purchaseVat" class="pm-select">
							<option value="0">%0</option>
							<option value="1">%1</option>
							<option value="10">%10</option>
							<option value="20" selected>%20</option>
						</select>
					</div>
				</div>

				<!-- ROW 2: Adet + Birim Fiyat -->
				<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
					<div>
						<label class="pm-label">Adet</label>
						<input id="purchaseQty" type="number" class="pm-input" placeholder="0" min="0" step="1" />
					</div>
					<div>
						<label class="pm-label">Birim Fiyat (TL)</label>
						<input id="purchaseUnit" type="number" class="pm-input" placeholder="0.00" min="0" step="0.01" />
					</div>
				</div>

				<!-- ROW 3: Toplam (full width) -->
				<div style="margin-bottom:20px;">
					<label class="pm-label">Toplam Tutar (TL)</label>
					<input id="purchaseTotal" type="number" class="pm-input" placeholder="0.00" min="0" step="0.01" />
				</div>

				<!-- LIVE SUMMARY CARD -->
				<div id="purchaseSummary" style="
					background:linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
					border:1.5px solid #e2e8f0;
					border-radius:14px;
					padding:18px 20px;
					margin-bottom:8px;
				">
					<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
						<span style="font-size:13px; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:0.05em;">Ozet</span>
					</div>
					<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">
						<div>
							<div style="font-size:12px; color:#94a3b8; margin-bottom:2px;">Ara Toplam</div>
							<div id="purchaseSummarySubtotal" style="font-size:18px; font-weight:800; color:#0f172a;">0.00 TL</div>
						</div>
						<div>
							<div style="font-size:12px; color:#94a3b8; margin-bottom:2px;">KDV Tutari</div>
							<div id="purchaseSummaryVat" style="font-size:18px; font-weight:800; color:#6366f1;">0.00 TL</div>
						</div>
						<div>
							<div style="font-size:12px; color:#94a3b8; margin-bottom:2px;">Genel Toplam</div>
							<div id="purchaseSummaryTotal" style="font-size:18px; font-weight:800; color:#059669;">0.00 TL</div>
						</div>
					</div>
				</div>
			</div>

			<!-- FOOTER BUTTONS -->
			<div style="padding:16px 28px 24px 28px; display:flex; justify-content:flex-end; gap:10px;">
				<button id="purchaseClose" class="btn btn-secondary" style="
					padding:11px 24px;
					font-size:14px;
					font-weight:600;
					border-radius:12px;
				">Kapat</button>
				<button id="purchaseSave" class="btn btn-primary" style="
					padding:11px 28px;
					font-size:14px;
					font-weight:700;
					border-radius:12px;
					min-width:120px;
				">Kaydet</button>
			</div>
		</div>
	</div>
