<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Check-Up Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- ============================== -->
    <!-- TOPBAR                         -->
    <!-- ============================== -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="8" fill="#34C759"/>
                    <path d="M8 14.5L12 18.5L20 10.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="logo-text">Check-Up</span>
            </div>
            <nav class="topbar-nav" id="topbarNav">
                <a href="#dashboard" class="nav-link active" data-view="dashboard">Ana Sayfa</a>
                <a href="#sales" class="nav-link" data-view="sales">Satışlar</a>
                <a href="#products" class="nav-link" data-view="products">Ürünler</a>
                <a href="#expenses" class="nav-link" data-view="expenses">Giderler</a>
                <a href="#stock" class="nav-link" data-view="stock">Stok</a>
                <a href="#events" class="nav-link" data-view="events">Etkinlikler</a>
                <a href="#calendar" class="nav-link" data-view="calendar">Takvim & Görevler</a>
                <a href="#reports" class="nav-link" data-view="reports">Raporlar</a>
                <a href="#transfer" class="nav-link" data-view="transfer">Aktarma</a>
                <a href="#settings" class="nav-link" data-view="settings">Ayarlar</a>
            </nav>
        </div>
        <div class="topbar-right">
            <span class="topbar-date" id="currentDate"></span>
            <div class="topbar-profile">
                <div class="profile-avatar">A</div>
                <span class="profile-name">Anka</span>
            </div>
            <button type="button" id="logoutBtn" style="
                border:1px solid #e5e7eb;
                background:#fff;
                color:#64748b;
                padding:8px 14px;
                border-radius:8px;
                font-size:13px;
                font-weight:600;
                cursor:pointer;
                margin-left:12px;
                transition:all .2s;
                font-family:inherit;
            ">Çıkış Yap</button>
        </div>

        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>

    <!-- ============================== -->
    <!-- SUB HEADER                     -->
    <!-- ============================== -->
    <div class="sub-header">
        <div class="sub-left">
            <h1 class="business-name" id="businessName">Holly Stone Adana</h1>
        </div>
        <div class="sub-center">
            <div class="today-tasks">
                <span class="tasks-label">Bugünün Görev Planı</span>
                <span class="tasks-count" id="taskCount">3 görev</span>
            </div>
        </div>
        <div class="sub-right">
            <div class="health-score">
                <div class="health-ring">
                    <svg viewBox="0 0 36 36">
                        <path class="health-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
                        <path class="health-fill" stroke-dasharray="78, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
                    </svg>
                    <span class="health-value">78</span>
                </div>
                <span class="health-label">Sağlık Skoru</span>
            </div>
        </div>
    </div>

    <!-- ============================== -->
    <!-- MAIN CONTENT                   -->
    <!-- ============================== -->
    <main class="main-content" id="viewContainer">
        <!-- Views render here -->
    </main>

    <!-- ============================== -->
    <!-- SCRIPTS                        -->
    <!-- ============================== -->

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Core Config -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="utils/toast.js"></script>
    <script src="js/core/error-handler.js"></script>
    <script src="services/supabase.js"></script>

    <!-- Utils -->
    <script src="utils/formatters.js"></script>
    <script src="utils/validators.js"></script>
    <script src="utils/import-export.js"></script>

    <!-- Services -->
    <script src="services/sales.js"></script>
    <script src="services/expenses.js"></script>
    <script src="services/products.js"></script>
    <script src="services/tasks.js"></script>
    <script src="services/events.js"></script>
    <script src="services/analytics.js"></script>

    <!-- Views -->
    <script src="views/dashboard-view.js"></script>
    <script src="views/sales-view.js"></script>
    <script src="views/expenses-view.js"></script>
    <script src="views/products-view.js"></script>
    <script src="views/stock-view.js"></script>
    <script src="views/calendar-view.js"></script>
    <script src="views/tasks-view.js"></script>
    <script src="views/events-view.js"></script>
    <script src="views/reports-view.js"></script>
    <script src="views/transfer-view.js"></script>
    <script src="views/settings-view.js"></script>

    <!-- App -->
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
